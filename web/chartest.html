<!doctype html><html><head><meta charset="utf-8"><title>Prueba de personajes</title></head>
<body style="margin:0;background:#666">
<script src="three.min.js"></script><script src="chars_data.js"></script><script src="chars.js"></script>
<script>
// Página de desarrollo: dibuja en rejilla todos los personajes (filtro, clip y tiempo por parámetros) y guarda una captura.
const TH=THREE,Q=new URLSearchParams(location.search);const W=+(Q.get('w')||1600),Hh=+(Q.get('h')||1000);
const r=new TH.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W,Hh);r.shadowMap.enabled=true;r.shadowMap.type=TH.PCFSoftShadowMap;
r.outputColorSpace=TH.SRGBColorSpace;r.toneMapping=TH.ACESFilmicToneMapping;r.toneMappingExposure=1.1;document.body.appendChild(r.domElement);
const sc=new TH.Scene();sc.background=new TH.Color(0x8fa6b8);sc.add(new TH.HemisphereLight(0xdfe8ff,0x55603a,1.3));
const d=new TH.DirectionalLight(0xfff2dd,2.6);d.position.set(-4,8,5);d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-8,right:8,top:8,bottom:-8});sc.add(d);
const gr=new TH.Mesh(new TH.PlaneGeometry(40,40).rotateX(-Math.PI/2),new TH.MeshStandardMaterial({color:0x6f8a4a,roughness:1}));gr.receiveShadow=true;sc.add(gr);
const CH=ImperiaChars;CH.init(sc);
const pre=(Q.get('f')||'').split(',').filter(Boolean);const keys=Object.keys(IMPERIA_CHARS.models).filter(k=>!pre.length||pre.some(p=>k.startsWith(p)));
const clip=Q.get('clip')||'idle',t=+(Q.get('t')||.4),cols=+(Q.get('cols')||Math.ceil(Math.sqrt(keys.length*1.6)));const sp=+(Q.get('sp')||1.1);
const yaw=+(Q.get('yaw')||-1.2);const PC=[0x2f6fd6,0xc8352a,0xe0b12a,0x8a4fcf];
keys.forEach((k,i)=>{const h=CH.alloc(k);const x=(i%cols-(cols-1)/2)*sp,z=(Math.floor(i/cols))*sp*1.1;const m=new TH.Matrix4().makeRotationY(yaw).setPosition(x,0,z);
 CH.set(h,m,(clip==='idle'&&IMPERIA_CHARS.models[k].gun)?'idle_gun':clip,t+i*.07*(Q.get('var')?1:0),PC[i%4],+(Q.get('mask')||(1<<1)|(1<<15)),0xe8c24c)});
const rows=Math.ceil(keys.length/cols);const cam=new TH.PerspectiveCamera(+(Q.get('fov')||30),W/Hh,.1,100);
const cz=(rows-1)*sp*1.1/2;const dist=+(Q.get('dist')||Math.max(cols*sp*1.25,rows*sp*1.6));cam.position.set(0,dist*.55,cz+dist);cam.lookAt(0,.35,cz);
CH.frame(Q.get('lod')==='1');r.render(sc,cam);window.__keys=keys;
const cv=document.createElement('canvas');cv.width=W;cv.height=Hh;const g2=cv.getContext('2d');g2.drawImage(r.domElement,0,0);g2.font='bold 15px Helvetica';g2.textAlign='center';
keys.forEach((k,i)=>{const x=(i%cols-(cols-1)/2)*sp,z=(Math.floor(i/cols))*sp*1.1;const v=new TH.Vector3(x,-.05,z).project(cam);const px=(v.x+1)/2*W,py=(1-v.y)/2*Hh+16;g2.fillStyle='#000a';g2.fillRect(px-60,py-13,120,18);g2.fillStyle='#fff';g2.fillText(k,px,py)});
const url=cv.toDataURL('image/png');
try{window.webkit.messageHandlers.store.postMessage({id:9,op:'write',key:'shot_'+(Q.get('name')||'chars'),data:url})}catch(e){}
window.__storeReply=()=>{};window.__done=1;
</script></body></html>
